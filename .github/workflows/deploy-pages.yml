name: Publish to GitHub Pages

# The site is served from the gh-pages branch (Settings → Pages).
# This workflow keeps gh-pages in sync with the development branch.

on:
  push:
    branches:
      - main
      - claude/barcode-toxicity-scanner-kvp3q6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to gh-pages
        run: git push --force origin HEAD:gh-pages
